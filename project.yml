name: AstroAdventure

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic

packages:
  AstroAdventureKit:
    path: .

targets:
  AstroAdventure-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/iOS
        excludes:
          - Info.plist
      - path: Apps/Shared
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Astro Adventure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GCSupportsControllerUserInteraction: true
        GCRequiresControllerUserInteraction: false
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.astro-adventure.game
        PRODUCT_NAME: Astro Adventure
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: AstroAdventureKit
        product: AstroUI

  AstroAdventure-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/tvOS
        excludes:
          - Info.plist
      - path: Apps/Shared
    info:
      path: Apps/tvOS/Info.plist
      properties:
        CFBundleDisplayName: Astro Adventure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GCSupportsControllerUserInteraction: true
        GCRequiresControllerUserInteraction: false
        LSApplicationCategoryType: public.app-category.games
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.astro-adventure.game.tv
        PRODUCT_NAME: Astro Adventure
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: AstroAdventureKit
        product: AstroUI

schemes:
  AstroAdventure-iOS:
    build:
      targets:
        AstroAdventure-iOS: all
    run:
      config: Debug
    archive:
      config: Release

  AstroAdventure-tvOS:
    build:
      targets:
        AstroAdventure-tvOS: all
    run:
      config: Debug
    archive:
      config: Release

name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Tests and Format
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Verify generated project configuration
        run: |
          for scheme in AstroAdventure-iOS AstroAdventure-tvOS; do
            settings="$(
              xcodebuild \
                -project AstroAdventure.xcodeproj \
                -scheme "$scheme" \
                -showBuildSettings
            )"

            grep -Fq \
              "PRODUCT_BUNDLE_IDENTIFIER = com.ganesh47.astroadventure" \
              <<< "$settings"
            grep -Fq "DEVELOPMENT_TEAM = J3387FUR8X" <<< "$settings"
            grep -Fq "CODE_SIGN_STYLE = Automatic" <<< "$settings"
          done

          git diff --exit-code -- \
            Apps/iOS/Info.plist \
            Apps/tvOS/Info.plist

      - name: Format
        run: swift format lint --recursive --strict Sources Tests Apps

      - name: Test packages
        run: swift test --enable-code-coverage

  apple-builds:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator Build
            scheme: AstroAdventure-iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS Simulator Build
            scheme: AstroAdventure-tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build
        run: |
          xcodebuild \
            -project AstroAdventure.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

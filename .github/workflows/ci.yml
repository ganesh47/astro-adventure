name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Tests and Format
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Format
        run: swift format lint --recursive --strict Sources Tests Apps

      - name: Test packages
        run: swift test --enable-code-coverage

  apple-builds:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator Build
            scheme: AstroAdventure-iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS Simulator Build
            scheme: AstroAdventure-tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build
        run: |
          xcodebuild \
            -project AstroAdventure.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

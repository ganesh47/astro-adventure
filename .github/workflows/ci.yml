name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Tests and Format
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Verify generated project configuration
        run: |
          for scheme in AstroAdventure-iOS AstroAdventure-tvOS; do
            settings="$(
              xcodebuild \
                -project AstroAdventure.xcodeproj \
                -scheme "$scheme" \
                -showBuildSettings
            )"

            grep -Fq \
              "PRODUCT_BUNDLE_IDENTIFIER = com.ganesh47.astroadventure" \
              <<< "$settings"
            grep -Fq "DEVELOPMENT_TEAM = J3387FUR8X" <<< "$settings"
            grep -Fq "CODE_SIGN_STYLE = Automatic" <<< "$settings"
          done

          git diff --exit-code -- \
            Apps/iOS/Info.plist \
            Apps/tvOS/Info.plist

      - name: Format
        run: swift format lint --recursive --strict Sources Tests Apps

      - name: Test packages
        run: swift test --enable-code-coverage

  apple-builds:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator Build
            scheme: AstroAdventure-iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS Simulator Build
            scheme: AstroAdventure-tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build
        run: |
          xcodebuild \
            -project AstroAdventure.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Apple TV remote gameplay smoke test
        if: matrix.scheme == 'AstroAdventure-tvOS'
        run: |
          device_id="$(
            xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [device["udid"] for runtime, entries in devices.items()
                        if "tvOS" in runtime for device in entries
                        if device.get("isAvailable") and "Apple TV" in device["name"]]
          if not candidates:
              raise SystemExit("No available Apple TV simulator")
          print(candidates[0])'
          )"
          xcodebuild \
            -project AstroAdventure.xcodeproj \
            -scheme AstroAdventure-tvOS \
            -destination "platform=tvOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            -resultBundlePath "$RUNNER_TEMP/AstroTVGameplay.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: iPhone touch gameplay smoke test
        if: matrix.scheme == 'AstroAdventure-iOS'
        run: |
          device_id="$(
            xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [device["udid"] for runtime, entries in devices.items()
                        if "iOS" in runtime for device in entries
                        if device.get("isAvailable") and "iPhone" in device["name"]]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(candidates[0])'
          )"
          xcodebuild \
            -project AstroAdventure.xcodeproj \
            -scheme AstroAdventure-iOS \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            -resultBundlePath "$RUNNER_TEMP/AstroTouchGameplay.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload touch gameplay test results
        if: always() && matrix.scheme == 'AstroAdventure-iOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: touch-gameplay-results
          path: ${{ runner.temp }}/AstroTouchGameplay.xcresult
          if-no-files-found: ignore

      - name: Upload Apple TV gameplay test results
        if: always() && matrix.scheme == 'AstroAdventure-tvOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-tv-gameplay-results
          path: ${{ runner.temp }}/AstroTVGameplay.xcresult
          if-no-files-found: ignore

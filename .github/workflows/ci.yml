name: Continuous Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-focus-diagnostic:
    name: Isolated TV restoration focus diagnostic
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Run exact failing restoration case
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [device["udid"] for runtime, entries in devices.items()
                        if "tvOS" in runtime for device in entries
                        if device.get("isAvailable") and "Apple TV" in device["name"]]
          if not candidates:
              raise SystemExit("No available Apple TV simulator")
          print(candidates[0])')"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project AstroAdventure.xcodeproj -scheme AstroAdventure-tvOS \
            -destination "platform=tvOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/TVFocusBuild" \
            -resultBundlePath "$RUNNER_TEMP/TVFocus.xcresult" \
            -only-testing:AstroAdventure-tvOS-UITests/ExplorationPlaygroundTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tv-focus-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/TVFocus.xcresult
          if-no-files-found: ignore
